<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ostéo Pratik — Techniques & Back-office</title>
<style>
:root{--bg:#07171a;--panel:#10272b;--line:#315159;--txt:#f4f7f5;--muted:#a9bab8;--accent:#7bd0b3;--warn:#f0bd6b}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--txt)} button,input,select,textarea{font:inherit}
header{position:sticky;top:0;z-index:5;background:#07171aee;backdrop-filter:blur(12px);border-bottom:1px solid #17343a;padding:16px 4vw;display:flex;align-items:center;gap:18px}
.logo{font-weight:900;letter-spacing:.08em;font-size:20px} .logo b{color:var(--accent)} nav{margin-left:auto;display:flex;gap:8px}
button,.btn{border:1px solid var(--line);background:#10272b;color:white;border-radius:999px;padding:10px 15px;cursor:pointer} button:hover{border-color:var(--accent)}
main{max-width:1250px;margin:auto;padding:38px 4vw 80px} h1{font-size:clamp(40px,7vw,86px);line-height:.9;margin:10px 0 18px} .muted{color:var(--muted)} .stats{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 18px} .stat b{font-size:25px;display:block}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:25px 0} input,select,textarea{width:100%;background:#0d2024;color:white;border:1px solid var(--line);border-radius:12px;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px} .card{background:linear-gradient(145deg,#123138,#0d2226);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;min-height:220px}
.card h3{font-size:17px;line-height:1.25;margin:10px 0} .tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)} .card .actions{margin-top:auto;display:flex;gap:8px} .missing{color:var(--warn)}
dialog{width:min(920px,94vw);max-height:92vh;background:#0b1e22;color:white;border:1px solid var(--line);border-radius:22px;padding:0} dialog::backdrop{background:#000b} .modal{padding:25px} .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px} label{font-size:12px;color:var(--muted)} label span{display:block;margin:0 0 6px} .wide{grid-column:1/-1}
.adminbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px} table{width:100%;border-collapse:collapse;background:#0d2024} th,td{padding:10px;border-bottom:1px solid #234047;text-align:left;font-size:13px} th{color:var(--muted);position:sticky;top:0;background:#0d2024} .tablewrap{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:16px}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000} .hidden{display:none!important}
@media(max-width:700px){.filters,.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}h1{font-size:48px}}
</style>
<style id="home-video-style">

/* Navigation anatomique — version fonctionnelle */
.appnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.appnav button.active{border-color:var(--accent);color:var(--accent)}
#homeVideoPage{position:relative;height:100vh;min-height:640px;background:#000;overflow:hidden}
#homeVideoPage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.homeShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.08) 55%,rgba(0,0,0,.66))}
.homeBrand{position:absolute;left:4vw;top:28px;font-weight:900;letter-spacing:.10em;font-size:20px}
.homeBrand b{color:var(--accent)}
.homeHint{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#dce7e4}
.homeMenu{position:absolute;left:4vw;right:4vw;bottom:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.homeMenu button{border-radius:16px;background:rgba(7,23,26,.72);backdrop-filter:blur(10px);padding:18px 12px;font-weight:800;letter-spacing:.08em}
.homeMenu button:hover{background:rgba(16,39,43,.9)}
#student{min-height:72vh}
.breadcrumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 20px;color:var(--muted);font-size:13px}
.breadcrumb button{padding:7px 11px}
.worldGrid,.regionGrid{display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:16px;margin:28px 0}
.worldCard,.regionCard{min-height:180px;border-radius:24px;text-align:left;padding:24px;background:linear-gradient(145deg,#123138,#0d2226);border:1px solid var(--line);color:var(--txt)}
.worldCard strong,.regionCard strong{display:block;font-size:25px;margin-bottom:8px}
.worldCard span,.regionCard span{color:var(--muted)}
.worldCard:hover,.regionCard:hover{border-color:var(--accent);transform:translateY(-1px)}
.videoToolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
.videoToolbar input{flex:1;min-width:260px}
.sectionTitle{font-size:clamp(34px,5vw,64px);line-height:1;margin:8px 0 12px}
#modulePlaceholder{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center}
#modulePlaceholder .box{max-width:700px}
@media(max-width:760px){
  .homeMenu{grid-template-columns:repeat(2,1fr)}
  .homeHint{bottom:160px}
  .worldGrid,.regionGrid{grid-template-columns:1fr}
  #homeVideoPage{min-height:720px}
}


.modeGrid{display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:16px;margin:28px 0}
.modeCard{min-height:175px;border-radius:24px;text-align:left;padding:24px;background:linear-gradient(145deg,#123138,#0d2226);border:1px solid var(--line);color:var(--txt)}
.modeCard strong{display:block;font-size:24px;margin-bottom:8px}
.modeCard span{color:var(--muted)}
.modeCard:hover{border-color:var(--accent);transform:translateY(-1px)}
.revisionStage{max-width:820px;margin:24px auto}
.revisionCard{background:linear-gradient(145deg,#123138,#0d2226);border:1px solid var(--line);border-radius:26px;padding:28px;min-height:340px;display:flex;flex-direction:column}
.revisionCard h2{font-size:clamp(24px,4vw,42px);margin:12px 0 18px}
.revisionMeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.revisionActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.zonePicker{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:14px;margin:24px 0}
.zonePicker button{min-height:110px;border-radius:20px;text-align:left}
.progressGrid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin:24px 0}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}
.metric b{display:block;font-size:30px;margin-bottom:6px}
.metric small{color:var(--muted)}
.progressPanel{background:#0d2024;border:1px solid var(--line);border-radius:22px;padding:20px;margin:16px 0}
.progressBars{display:grid;gap:12px}
.progressRow{display:grid;grid-template-columns:180px 1fr 58px;gap:12px;align-items:center}
.progressBar{height:10px;background:#17343a;border-radius:999px;overflow:hidden}
.progressBar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.quizBox{max-width:760px;margin:24px auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px}
.quizOptions{display:grid;gap:10px;margin:18px 0}
.quizOptions button{border-radius:14px;text-align:left}
.smallNote{font-size:12px;color:var(--muted)}

@media(max-width:700px){.modeGrid,.zonePicker,.progressGrid{grid-template-columns:1fr}.progressRow{grid-template-columns:1fr}.progressRow>span:last-child{text-align:left}}

</style>
</head>

<main>

  <div id="videoNav"></div>
</section>

<section id="admin" class="hidden">
<div class="tag">Administration</div><h1>Back-office.</h1><p class="muted">Ajoute, corrige, classe et publie les techniques. Les modifications sont immédiatement répercutées côté étudiant sur ce navigateur.</p>
<div class="adminbar"><button onclick="newTechnique()">＋ Nouvelle technique</button><button onclick="resetData()">Restaurer les données d’origine</button><button onclick="exportData()">Exporter JSON</button><span id="adminCount" class="muted"></span></div>
<div class="tablewrap"><table><thead><tr><th>Statut</th><th>Technique</th><th>Monde</th><th>Région</th><th>Vidéo</th><th></th></tr></thead><tbody id="adminRows"></tbody></table></div>
</section>
</main>

<dialog id="viewer"><div class="modal"><button style="float:right" onclick="viewer.close()">✕</button><div id="viewContent"></div></div></dialog>
<dialog id="editor"><form class="modal" onsubmit="saveTechnique(event)"><button type="button" style="float:right" onclick="editor.close()">✕</button><h2>Éditer la technique</h2><input type="hidden" id="eId">
<div class="formgrid">
<label class="wide"><span>Titre</span><input id="eTitre" required></label>
<label><span>Monde anatomique</span><input id="eMonde"></label><label><span>Région / articulation</span><input id="eRegion"></label>
<label><span>Niveau</span><select id="eNiveau"><option>Tous niveaux</option><option>Débutant</option><option>Intermédiaire</option><option>Avancé</option></select></label>
<label><span>Statut</span><select id="eStatut"><option value="publie">Publié</option><option value="brouillon">Brouillon</option></select></label>
<label class="wide"><span>URL Vimeo</span><input id="eVideo" placeholder="https://vimeo.com/..."></label>
<label><span>Image</span><input id="eImage"></label><label><span>Quiz associé</span><input id="eQuiz"></label>
<label class="wide"><span>Texte de la technique</span><textarea id="eTexte" rows="8"></textarea></label>
</div><div style="display:flex;gap:10px;margin-top:18px"><button type="submit">Enregistrer</button><button type="button" onclick="deleteTechnique()">Supprimer</button></div></form></dialog>

const STUDY_KEY='osteoPratikStudyState';
let study=JSON.parse(localStorage.getItem(STUDY_KEY)||'null')||{

};
function saveStudy(){localStorage.setItem(STUDY_KEY,JSON.stringify(study));}
function markActive(zone=''){
  const d=new Date().toISOString().slice(0,10);
  if(!study.activeDays.includes(d))study.activeDays.push(d);

}
let revisionPool=[], revisionIndex=0, revisionMode='random';
function startRevision(mode,world='',region=''){
  revisionMode=mode;
  let pool=published().filter(x=>x.video||x.texte||x.titre);
  if(mode==='zone')pool=pool.filter(x=>x.monde===world&&x.region===region);
  if(mode==='seen')pool=pool.filter(x=>study.seen.includes(x.id));
  if(mode==='random'||mode==='audio')pool=[...pool].sort(()=>Math.random()-.5);
  revisionPool=pool;revisionIndex=0;
  study.series++;markActive(region||world||mode);
  renderRevisionCard();
}
function renderRevisionCard(){
  setModule();
  if(!revisionPool.length){
    $('moduleContent').innerHTML=`<div class="breadcrumb"><button onclick="openRevise()">← Réviser</button></div><div class="tag">Réviser</div><h1 class="sectionTitle">Aucune technique disponible.</h1><p class="muted">Ce mode n'a encore aucun contenu correspondant.</p>`;
    return;
  }
  const x=revisionPool[revisionIndex%revisionPool.length];
  if(!study.seen.includes(x.id))study.seen.push(x.id);
  markActive(x.region||x.monde);
  const vid=vimeoId(x.video);
  $('moduleContent').innerHTML=`<div class="breadcrumb"><button onclick="openRevise()">← Réviser</button><span>${revisionIndex+1} / ${revisionPool.length}</span></div>
    <div class="revisionStage"><article class="revisionCard">
      <div class="revisionMeta"><span class="tag">${esc(x.monde)} · ${esc(x.region)}</span><span class="tag">${esc(x.niveau)}</span></div>
      <h2>${esc(x.titre)}</h2>
      <div id="revisionDetail" class="muted">${revisionMode==='audio'?(x.texte?esc(x.texte):'Texte de technique non renseigné.'):'Appuyez sur « Voir la réponse » pour afficher le contenu disponible.'}</div>
      <div class="revisionActions">
        ${revisionMode!=='audio'?`<button onclick="showRevisionAnswer(${x.id})">Voir la réponse</button>`:''}
        ${revisionMode==='audio'?`<button onclick="speakRevision(${x.id})">🔊 Écouter</button>`:''}
        ${vid?`<button onclick="viewTechnique(${x.id})">Voir la vidéo</button>`:''}
        <button onclick="nextRevision()">Suivante →</button>
      </div>
    </article></div>`;
}
function showRevisionAnswer(id){
  const x=techniques.find(t=>t.id===id);
  $('revisionDetail').innerHTML=x.texte?`<p>${esc(x.texte)}</p>`:`<p>${x.video?'La vidéo de cette technique est disponible.':'Aucun texte détaillé n’est encore renseigné pour cette technique.'}</p>`;
}
function speakRevision(id){
  const x=techniques.find(t=>t.id===id),txt=(x.texte||x.titre||'').trim();

}

  moduleHome('Tester','Choisissez le type de quiz.',[

function pickTestZones(){
  setModule();
  $('moduleContent').innerHTML=`<div class="breadcrumb"><button onclick="openTest()">← Tester</button></div><div class="tag">Tester · Par zone</div>
  <h1 class="sectionTitle">Choisissez une zone.</h1>
  <div class="zonePicker">${Object.keys(ANATOMY).map(w=>`<button onclick="startQuiz('zone',${JSON.stringify(w)})"><b>${esc(w)}</b><br><span class="muted">${ANATOMY[w].join(' · ')}</span></button>`).join('')}</div>`;

let quizPool=[],quizIndex=0,quizScore=0,quizKind='general',quizZone='';
function startQuiz(kind,zone=''){
  quizKind=kind;quizZone=zone;quizScore=0;quizIndex=0;
  quizPool=published().filter(x=>kind==='general'||x.monde===zone).sort(()=>Math.random()-.5).slice(0,10);
  study.series++;markActive(zone||'Quiz général');renderQuizQuestion();
}
function renderQuizQuestion(){
  setModule();
  if(!quizPool.length){$('moduleContent').innerHTML='<h1 class="sectionTitle">Aucune question disponible.</h1>';return;}
  if(quizIndex>=quizPool.length){finishQuiz();return;}
  const x=quizPool[quizIndex];
  const allRegions=[...new Set(published().map(t=>t.region).filter(r=>r&&r!=='À classer'))];
  const wrong=allRegions.filter(r=>r!==x.region).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[x.region,...wrong].sort(()=>Math.random()-.5);
  $('moduleContent').innerHTML=`<div class="breadcrumb"><button onclick="openTest()">← Tester</button><span>Question ${quizIndex+1} / ${quizPool.length}</span></div>
    <div class="quizBox"><div class="tag">${quizKind==='general'?'Quiz général':'Quiz · '+esc(quizZone)}</div><h2>${esc(x.titre)}</h2>
    <p class="muted">À quelle zone / région cette technique appartient-elle ?</p>
    <div class="quizOptions">${opts.map(o=>`<button onclick='answerQuiz(${JSON.stringify(o===x.region)})'>${esc(o)}</button>`).join('')}</div>
    <div class="smallNote">Score actuel : ${quizScore} / ${quizIndex}</div></div>`;
}
function answerQuiz(ok){if(ok)quizScore++;quizIndex++;renderQuizQuestion();}
function finishQuiz(){
  const result={date:new Date().toISOString(),score:quizScore,total:quizPool.length,kind:quizKind,zone:quizZone};
  study.quizHistory.push(result);study.lastQuiz=result;
  if(quizKind==='general')study.generalQuiz.push(result);
  markActive(quizZone||'Quiz général');
  saveStudy();
  $('moduleContent').innerHTML=`<div class="tag">Quiz terminé</div><h1 class="sectionTitle">${quizScore} / ${quizPool.length}</h1>
    <p class="muted">${quizKind==='general'?'Quiz général':'Zone : '+esc(quizZone)}</p><div class="modeGrid">${modeCard('Recommencer','Lancer une nouvelle série.','openTest()')}${modeCard('Voir ma progression','Consulter les statistiques.','openProgression()')}</div>`;
}

function pct(n,d){return d?Math.round(n/d*100):0;}
function openProgression(){
  setModule();
  const pub=published().length;
  const globalPct=pct(study.seen.length,pub);
  const gq=study.generalQuiz, gqCorrect=gq.reduce((s,q)=>s+q.score,0), gqTotal=gq.reduce((s,q)=>s+q.total,0);
  const gqPct=pct(gqCorrect,gqTotal);
  const last=study.lastActivity?new Date(study.lastActivity).toLocaleString('fr-FR'):'Aucune';
  const zones=Object.keys(ANATOMY);
  const zoneRows=zones.map(z=>{
    const ids=published().filter(x=>x.monde===z).map(x=>x.id), seen=ids.filter(id=>study.seen.includes(id)).length;
    return {z,p:pct(seen,ids.length),a:study.zoneActivity[z]||0};
  });
  const most=[...zoneRows].sort((a,b)=>b.a-a.a)[0];
  const qh=study.quizHistory, qCorrect=qh.reduce((s,q)=>s+q.score,0), qTotal=qh.reduce((s,q)=>s+q.total,0), qPct=pct(qCorrect,qTotal);
  const lq=study.lastQuiz;
  $('moduleContent').innerHTML=`<div class="tag">Progression</div><h1 class="sectionTitle">Mes statistiques.</h1>
    <div class="progressGrid">
      <div class="metric"><b>${globalPct}%</b><small>Progression globale</small></div>
      <div class="metric"><b>${gqPct}%</b><small>Quiz général</small></div>
      <div class="metric"><b>${study.series}</b><small>Séries réalisées</small></div>
      <div class="metric"><b>${study.activeDays.length}</b><small>Jours actifs</small></div>
    </div>
    <div class="progressPanel"><h3>Dernière activité</h3><p class="muted">${esc(last)}</p></div>
    <div class="progressPanel"><h3>Zones les plus travaillées</h3><p>${most&&most.a?esc(most.z)+' · '+most.a+' activité(s)':'Pas encore assez de données.'}</p></div>
    <div class="progressPanel"><h3>Progression par zone</h3><div class="progressBars">${zoneRows.map(r=>`<div class="progressRow"><span>${esc(r.z)}</span><div class="progressBar"><i style="width:${r.p}%"></i></div><span>${r.p}%</span></div>`).join('')}</div></div>
    <div class="progressPanel"><h3>Performances au quiz</h3><p><b>${qPct}%</b> de bonnes réponses sur ${qTotal} question(s).</p></div>
    <div class="progressPanel"><h3>Dernier quiz terminé</h3><p>${lq?`${lq.score}/${lq.total} · ${lq.kind==='general'?'Général':'Zone '+esc(lq.zone)} · ${new Date(lq.date).toLocaleString('fr-FR')}`:'Aucun quiz terminé pour le moment.'}</p></div>`;
}

}

 viewer.showModal();

function editTechnique(id){const x=techniques.find(t=>t.id===id); for(const [k,v] of Object.entries({Id:x.id,Titre:x.titre,Monde:x.monde,Region:x.region,Niveau:x.niveau,Statut:x.statut,Video:x.video,Image:x.image,Quiz:x.quiz,Texte:x.texte})) $('e'+k).value=v??'';editor.showModal();}

renderVideoNavigation();}

<script id="home-video-script">
(()=>{
 const hero=document.getElementById('homeVideoPage'),v=document.getElementById('homeVideo');
 let target=0,touchY=null;
 const max=()=>Math.max(0,(v.duration||10)-0.03);
 const clamp=t=>Math.max(0,Math.min(max(),t));
 addEventListener('wheel',e=>{
   const rect=hero.getBoundingClientRect();
   const heroActive=rect.top>=-2 && rect.bottom>innerHeight*.55;
   if(!heroActive)return;
   const atEnd=target>=max()-.05 && e.deltaY>0;
   const atStart=target<=.05 && e.deltaY<0;
   if(atEnd||atStart)return;
   e.preventDefault();
   target=clamp(target+e.deltaY*.0028);
   v.currentTime=target;
 },{passive:false});
 hero.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});
 hero.addEventListener('touchmove',e=>{
   if(touchY===null)return;
   const ny=e.touches[0].clientY,dy=touchY-ny;
   const atEnd=target>=max()-.05&&dy>0,atStart=target<=.05&&dy<0;
   if(!(atEnd||atStart)){target=clamp(target+dy*.012);v.currentTime=target;e.preventDefault();}
   touchY=ny;
 },{passive:false});
 v.addEventListener('loadedmetadata',()=>{target=clamp(v.currentTime||0)});
})();
</script>
